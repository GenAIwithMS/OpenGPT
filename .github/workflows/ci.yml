# Tests on every push to main and every pull request. After a push to main
# passes, the Docker image is built and pushed to Docker Hub
# (genaiwithms/opengpt:latest and :sha-<commit>).
#
# Docker Hub needs two repository secrets (Settings > Secrets and variables >
# Actions): DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (an access token with
# read and write access, not the account password).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install packages
        # The CPU build of PyTorch, as in the Dockerfile: much smaller.
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.13.0
          pip install -r backend/requirements.txt
      - name: Run tests
        working-directory: backend
        run: python -m unittest discover -s tests -t .

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install packages
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Build
        working-directory: frontend
        run: npm run build

  coding-agent:
    name: Coding agent type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install packages
        working-directory: coding-agent
        run: bun install --frozen-lockfile --network-concurrency=16
      - name: Type check
        working-directory: coding-agent
        run: bun run typecheck:tsc

  browser-engine:
    name: Browser engine tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/browser_engine
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: backend/browser_engine/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24.22.3"
          cache: pnpm
          cache-dependency-path: backend/browser_engine/pnpm-lock.yaml
      - name: Install packages
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser tests
        run: pnpm test:browser

  docker:
    name: Build and push image
    needs: [backend, frontend, coding-agent, browser-engine]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: docker-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/genaiwithms/opengpt
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
